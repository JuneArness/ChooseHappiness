# Builds the site and publishes it to GitHub Pages every time you push to main.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
# Until you add the Supabase secrets (Settings > Secrets and variables > Actions), this builds
# PREVIEW mode: sample sign-ins, data saved only in each visitor's browser.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: |
          if [ -n "$VITE_SUPABASE_URL" ]; then
            echo "Supabase secrets found: building the LIVE site"
            npm run build
          else
            echo "No Supabase secrets yet: building PREVIEW mode"
            npm run build:demo
          fi
          # GitHub Pages has no server-side routing; 404.html lets links like /journal load the app.
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
